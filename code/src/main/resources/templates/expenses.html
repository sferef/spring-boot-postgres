<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cities</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<h2>All expenses</h2>

<table>
    <tr>
        <th>name</th>
        <th>category</th>
        <th>amount</th>
        <tn>customer</tn>
    </tr>

    <tr th:each="Expenses 2021 : ${allExpenses}">
        <td th:text="${allExpenses.name}">name</td>
        <td th:text="${allExpenses.category}">category</td>
        <td th:text="${allExpenses.amount}">amount</td>
        <td th:text="${allExpenses.customer}">customer</td>
    </tr>

</table>

</body>
</html>
